name: OpenAPI JSON Generate Workflow

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - '**'
  workflow_dispatch:

jobs:
  openapi-publish:
    name: OpenAPI JSON Generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup python for openapi generate
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Generate openapi json
        uses: ./.github/actions/openapi-generate
      - name: Commit Changes
        uses: EndBug/add-and-commit@v7
        if: env.OPENAPI_CHANGED == 'true'
        with:
          default_author: github_actions
          message: "Generated new openapi.json on push to ${{ github.event.inputs.git-ref }}"
          add: "api-docs/generated/openapi.json"
